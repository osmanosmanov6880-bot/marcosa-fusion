<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
 <title id="title">MARCOSA — Orbital M</title>
 <desc id="desc">Сдержанная монограмма MARCOSA цвета матового шампанского на глубоком графите.</desc>
 <defs>
  <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#e5d3b5"/>
   <stop offset=".56" stop-color="#bda587"/>
   <stop offset="1" stop-color="#e0c8a7"/>
  </linearGradient>
  <filter id="gold-glow" x="-.2" y="-.2" width="1.4" height="1.4">
   <feGaussianBlur stdDeviation="0.5"/>
  </filter>
  <filter id="subtle-shadow" x="-.25" y="-.25" width="1.5" height="1.5">
   <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#141714" flood-opacity=".18"/>
  </filter>
 </defs>
 <rect width="512" height="512" rx="90" fill="#272d27"/>
 <rect x="12" y="12" width="488" height="488" rx="80" fill="none" stroke="#c5b195" stroke-opacity=".38" stroke-width="2"/>
 <ellipse cx="256" cy="257" rx="204" ry="204" fill="none" stroke="#e3d3b7" stroke-opacity=".10" stroke-width="1.8"/>
 <path d="M118 370 V136 L257 278 L394 136 V370 H353 V226 L257 323 L159 226 V370 Z" fill="url(#champagne)" filter="url(#subtle-shadow)"/>
 <path d="M139 176 L256 294 L374 175" fill="none" stroke="#fff5e3" stroke-opacity=".42" stroke-width="3" stroke-linejoin="round"/>
 <path d="M117 403 H395" stroke="#b7a182" stroke-opacity=".37" stroke-width="2"/>
 <path d="M256 101 V120" stroke="#e4d3b5" stroke-opacity=".7" stroke-width="2"/>
</svg>