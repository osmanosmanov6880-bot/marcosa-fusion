<path d="M130 152 L256 276 L382 152" fill="none" stroke="url(#bevel)" stroke-width="8" stroke-linejoin="round" opacity=".9"/>
<path d="M160 231 L256 326 L353 231" fill="none" stroke="#fff1da" stroke-width="2.6" opacity=".5"/>
</g>
<path d="M56 335 Q232 432 435 257" fill="none" stroke="url(#orbit)" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="413" cy="170" r="2.4" fill="#e5ccaa"/>
</svg>