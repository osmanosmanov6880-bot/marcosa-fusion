<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">MARCOSA — Orbital M</title>
<desc id="desc">Объёмная монограмма М из матового шампанского золота на тёмном сапфире, с одной тонкой фирменной орбитой.</desc>
<defs>
<radialGradient id="sapphire" cx=".26" cy=".12" r=".9"><stop stop-color="#233346"/><stop offset=".5" stop-color="#101a29"/><stop offset="1" stop-color="#080e19"/></radialGradient>
<linearGradient id="brass" x1="0" y1="0" x2=".94" y2="1"><stop stop-color="#fff0d5"/><stop offset=".17" stop-color="#e1be8d"/><stop offset=".38" stop-color="#ab784c"/><stop offset=".61" stop-color="#f1d5ad"/><stop offset=".85" stop-color="#b78c5b"/><stop offset="1" stop-color="#e7c998"/></linearGradient>
<linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0d0"/><stop offset=".54" stop-color="#c59a69"/><stop offset="1" stop-color="#765335"/></linearGradient>
<linearGradient id="orbit" x1="0" y1=".5" x2="1" y2=".5"><stop stop-color="#8e775a" stop-opacity="0"/><stop offset=".18" stop-color="#e4c49a" stop-opacity=".72"/><stop offset=".4" stop-color="#f2d4a5"/><stop offset=".7" stop-color="#b28f63" stop-opacity=".85"/><stop offset="1" stop-color="#b49872" stop-opacity="0"/></linearGradient>
<filter id="gold-glow" x="-.25" y="-.25" width="1.5" height="1.5"><feGaussianBlur stdDeviation=".7"/></filter>
<filter id="subtle-shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".58"/></filter>
</defs>
<rect x="4" y="4" width="504" height="504" rx="92" fill="url(#sapphire)" stroke="#b99d76" stroke-width="3" stroke-opacity=".58"/>
<rect x="20" y="20" width="472" height="472" rx="79" fill="none" stroke="#f0d8af" stroke-width="1" stroke-opacity=".16"/>
<ellipse cx="256" cy="267" rx="223" ry="92" transform="rotate(-17 256 267)" fill="none" stroke="#ae8c5e" stroke-opacity=".17" stroke-width="8"/>
<ellipse cx="256" cy="267" rx="223" ry="92" transform="rotate(-17 256 267)" fill="none" stroke="url(#orbit)" stroke-width="3"/>
<g filter="url(#subtle-shadow)">
