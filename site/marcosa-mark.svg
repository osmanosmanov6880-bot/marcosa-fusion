<linearGradient id="orbit" x1="0" y1=".4" x2="1" y2=".6"><stop stop-color="#c58b4e" stop-opacity=".03"/><stop offset=".17" stop-color="#f9dfaf"/><stop offset=".28" stop-color="#fff0d0"/><stop offset=".48" stop-color="#d09b5b"/><stop offset=".76" stop-color="#ffe0a4"/><stop offset="1" stop-color="#9d603c" stop-opacity=".1"/></linearGradient>
