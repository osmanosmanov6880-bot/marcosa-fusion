<linearGradient id="metal" x1="0" y1=".08" x2="1" y2=".93"><stop offset="0" stop-color="#fff7e3"/><stop offset=".18" stop-color="#f2d4a6"/><stop offset=".34" stop-color="#b47a41"/><stop offset=".49" stop-color="#ffefd4"/><stop offset=".72" stop-color="#c28e57"/><stop offset=".95" stop-color="#78502d"/></linearGradient>
