name: "MARCOSA | R172 protected staging, AWS offsite and PG17 RTO/nonce"
on:
  pull_request:
    paths:
      - "ops/r172/**"
      - "ops/test/r172.*"
      - ".github/workflows/marcosa-r172-readiness.yml"
      - "ops/r162/release-evidence.mjs"
      - "ops/r163/repro-bundle.mjs"
      - "docs/MARCOSA_R172_*"
  push:
    branches: ["feature/**", "codex/**"]
    paths:
      - "ops/r172/**"
      - "ops/test/r172.*"
      - ".github/workflows/marcosa-r172-readiness.yml"
      - "ops/r162/release-evidence.mjs"
      - "ops/r163/repro-bundle.mjs"
      - "docs/MARCOSA_R172_*"
  workflow_dispatch:
# No id-token:write, AWS keys, GitHub protected environment or production.
permissions:
  contents: read
jobs:
  r172-disposable-pg17-and-read-only-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: r172-synthetic-disposable-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: r172-synthetic-disposable-only
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require exact SHA and no AWS/GitHub OIDC token or production PostgreSQL
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "osmanosmanov6880-bot/marcosa-fusion"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          psql -v ON_ERROR_STOP=1 -Atc "SELECT current_setting('server_version_num')::int BETWEEN 170000 AND 179999" | grep -qx t
      - name: Restore exact SHA-pinned real AWS SDK v3 IAM/STS/S3/KMS graph and install without scripts
        run: |
          set -euo pipefail
          base64 -d ops/r170/package-lock.json.gz.b64 | gzip -dc > ops/r170/package-lock.json
          echo '29825ad0ccbe541a7328e8293fe6ccde272a17bf26a6960f5d031d6cbd0c1e86  ops/r170/package-lock.json' | sha256sum -c -
          npm ci --prefix ops/r170 --ignore-scripts --no-audit --no-fund
          npm ls --prefix ops/r170 --depth=0
      - name: R171 and R172 regression (GitHub, IAM, OIDC, offsite and failure modes)
        run: |
          set -euo pipefail
          node --test ops/test/r171.*.test.mjs ops/test/r172.*.test.mjs
      - name: Strict PG17 synthetic Auth, RLS, quarantine and atomic nonce/audit fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/173_r167_synthetic_source.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/174_r171_fence.sql
      - name: Real PG17 dump, AES-GCM restore, measured recovery window and AWS SDK-shaped source checks
        env:
          R172_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          node ops/r172/ci-acceptance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: r172-disposable-readiness-nonsecret-evidence
          path: ${{ runner.temp }}/r172-isolated-readiness-evidence.json
          retention-days: 7
          if-no-files-found: error
  r172-independent-source-and-recovery-claim-review:
    needs: r172-disposable-pg17-and-read-only-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      PGHOST: ""
      PGPASSWORD: ""
      AWS_EC2_METADATA_DISABLED: "true"
      R172_SECOND_RUNNER: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: r172-disposable-readiness-nonsecret-evidence
          path: ${{ runner.temp }}/r172-second/
      - name: SHA-256 source rebuild and strict synthetic non-production report review
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          node ops/r172/ci-acceptance.mjs
