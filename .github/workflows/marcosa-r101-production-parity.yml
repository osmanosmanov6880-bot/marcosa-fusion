name: "MARCOSA | R101 live-vs-static parity report (read-only)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marcosa-r101-production-parity.yml"
      - "tools/production_parity_audit.py"
      - "tests/test_production_parity_audit.py"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/marcosa-r101-production-parity.yml"
      - "tools/production_parity_audit.py"
      - "tests/test_production_parity_audit.py"
      - "ops/loopback_staging_http.py"
      - "tests/test_loopback_staging_http.py"
permissions:
  contents: read
concurrency:
  group: marcosa-production-parity-audit
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parity and temporary loopback HTTP without network credentials
        run: |
          python -m unittest discover -s tests -p 'test_production_parity_audit.py' -v
          python -m unittest discover -s tests -p 'test_loopback_staging_http.py' -v
          python -m py_compile tools/production_parity_audit.py ops/loopback_staging_http.py
          bash -n ops/ssh-stage-verified.sh
  audit:
    if: github.repository == 'osmanosmanov6880-bot/marcosa-fusion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marcosa-staging
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run source-only, no-network parity regression tests
        run: |
          python -m unittest discover -s tests -p 'test_production_parity_audit.py' -v
          python -m py_compile tools/production_parity_audit.py
      - name: Independently verify VPS, inspect public legacy and staged assets read-only
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
          EXPECTED_DEPLOY_KEY_FP: SHA256:b6e0zrGwnTCu5yo9IZstiPw+5EGfahHgVpI3TWeccA0
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" == "marcosa-deploy" ]] || exit 2
          source ops/load-pinned-staging-host.sh
          : "${DEPLOY_KEY:?Missing restricted SSH key}"
          umask 077
          TMP="$(mktemp -d)"
          trap 'rm -rf -- "$TMP"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$TMP/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$TMP/known_hosts"
          chmod 600 "$TMP/key" "$TMP/known_hosts"
          KEY_FP="$(ssh-keygen -y -P '' -f "$TMP/key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          [[ "$KEY_FP" == "$EXPECTED_DEPLOY_KEY_FP" ]] || exit 2
          node ops/verify-staging-host-key.mjs --hostname "$DEPLOY_HOST" \
            --port "$DEPLOY_PORT" --known-hosts "$TMP/known_hosts" \
            --expected "$DEPLOY_HOST_FINGERPRINT"
          ssh -i "$TMP/key" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$TMP/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' \
            < tools/production_parity_audit.py > production-parity-r101.json
          # The report contains only known public asset names, hashes and counts.
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('production-parity-r101.json','utf8'));
          if(p.format!=='MARCOSA-PRODUCTION-PARITY-R101' ||
             p.auditReadOnly!==true || p.productionAuthorized!==false ||
             p.directRootReplacementAllowed!==false ||
             !/^[a-f0-9]{40}$/.test(p.stagingSourceSha) ||
             !Array.isArray(p.riskFlags)) throw Error('Unsafe or invalid parity audit response');
          console.log(JSON.stringify(p,null,2));
          const summary=[
            '### MARCOSA R101: independent live-vs-staging compatibility check',
            '- Live index SHA-256: '+p.liveIndexSha256,
            '- Staged index SHA-256: '+p.stagingIndexSha256,
            '- Are pages byte-identical? '+(p.indexBytesIdentical?'YES':'NO'),
            '- Legacy top-level public files: '+p.legacyPublicTopLevelCount,
            '- Staging manifest files: '+p.stagingManifestCount,
            '- Legacy-only root public files: '+p.legacyOnlyTopLevelCount,
            '- Staging-only root public files: '+p.previewOnlyTopLevelCount,
            '- Critical legacy JS integrations missing from preview: '+p.criticalMissingFromStaticPreview.join(', '),
            '- Risk flags: '+p.riskFlags.join(', '),
            '- **Safe to overwrite root? NO — production root replacement is forbidden.**',
            '- No production writes, no Nginx reload, no private data copied.',
            ''
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          NODE
      - name: Store bounded, scrubbed compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-production-parity-r101
          path: production-parity-r101.json
          retention-days: 14
          if-no-files-found: error
