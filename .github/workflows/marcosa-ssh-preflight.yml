name: "MARCOSA | SSH preflight / safe connection check"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose-staging-ssh.sh"
      - ".github/workflows/marcosa-ssh-preflight.yml"
      - ".github/workflows/marcosa-staging.yml"
      - "ops/load-pinned-staging-host.sh"
      - "ops/ssh/marcosa-staging-known-hosts"

permissions:
  contents: read

concurrency:
  group: marcosa-ssh-preflight
  cancel-in-progress: true

jobs:
  ssh-preflight:
    # Secrets are examined only on trusted main, not PRs or forks.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marcosa-staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate and probe pinned SSH access (READ ONLY)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
          EXPECTED_DEPLOY_KEY_FP: SHA256:b6e0zrGwnTCu5yo9IZstiPw+5EGfahHgVpI3TWeccA0
          EXPECTED_STAGING_HOST: 169.58.48.38
        run: |
          set -euo pipefail
          source ops/load-pinned-staging-host.sh
          bash -n scripts/diagnose-staging-ssh.sh
          bash scripts/diagnose-staging-ssh.sh
