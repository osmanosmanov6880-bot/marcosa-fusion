name: MARCOSA | Read-only SSH preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marcosa-ssh-preflight
  cancel-in-progress: false

jobs:
  verify-staging-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration and pinned SSH host key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.MARCOSA_STAGING_KEY }}
          KNOWN_HOSTS: ${{ secrets.MARCOSA_STAGING_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set MARCOSA_STAGING_HOST}"
          : "${DEPLOY_USER:?Set MARCOSA_STAGING_USER}"
          : "${DEPLOY_KEY:?Set MARCOSA_STAGING_KEY}"
          : "${KNOWN_HOSTS:?Set MARCOSA_STAGING_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 2
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$DEPLOY_USER" != root ]] || exit 2
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/marcosa_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marcosa_deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/marcosa_deploy" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=12 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu; test -d /opt/marcosa; test -d /opt/marcosa/site; test -f "$HOME/marcosa-staging/.staging-approved"; echo "MARCOSA staging target validated (read-only)"'
