name: "MARCOSA | disposable PostgreSQL RLS contract"
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql"
      - "docs/MARCOSA_R37_POSTGRES_ACTIVITY_APPEALS_REFERENCE.sql"
      - "docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql"
      - "docs/MARCOSA_R43_POSTGRES_BOOKMARKS_REFERENCE.sql"
      - "docs/MARCOSA_R46_POSTGRES_PILOT_INVITES_REFERENCE.sql"
      - "docs/MARCOSA_R51_POSTGRES_NOTIFICATION_SETTINGS_REFERENCE.sql"
      - "docs/MARCOSA_R55_PRIVATE_MEDIA_MANIFEST_REFERENCE.sql"
      - "tests/postgres/**"
      - ".github/workflows/marcosa-postgres-rls-reference.yml"
  push:
    branches: [main]
    paths:
      - "docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql"
      - "docs/MARCOSA_R37_POSTGRES_ACTIVITY_APPEALS_REFERENCE.sql"
      - "docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql"
      - "docs/MARCOSA_R43_POSTGRES_BOOKMARKS_REFERENCE.sql"
      - "docs/MARCOSA_R46_POSTGRES_PILOT_INVITES_REFERENCE.sql"
      - "docs/MARCOSA_R51_POSTGRES_NOTIFICATION_SETTINGS_REFERENCE.sql"
      - "docs/MARCOSA_R55_PRIVATE_MEDIA_MANIFEST_REFERENCE.sql"
      - "tests/postgres/**"
      - ".github/workflows/marcosa-postgres-rls-reference.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: local-ci-only-rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: local-ci-only-rls
    steps:
      - uses: actions/checkout@v4
      - name: Prove isolated PostgreSQL service is available
        run: |
          set -euo pipefail
          command -v psql
          psql -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version');"
      - name: Create simulated Auth roles in disposable CI database only
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/00_auth_fixture.sql
      - name: Execute reviewed R30 reference SQL against PostgreSQL 17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql
      - name: Test anon, three separate identities, ownership and forbidden writes
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/10_rls_isolation.sql
      - name: Create additive R37 activity and appeal RLS schema in isolated Postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R37_POSTGRES_ACTIVITY_APPEALS_REFERENCE.sql
      - name: Verify activity and appeals with three distinct identities
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/20_rls_activity_appeals.sql
      - name: Create R41 owner-only user block RLS in isolated PostgreSQL 17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql
      - name: Verify owner privacy and browser-denied block mutations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/30_rls_user_blocks.sql
      - name: Apply R43 saved stories privacy contract to disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R43_POSTGRES_BOOKMARKS_REFERENCE.sql
      - name: Test three owner identities, denied writes and FK cascade for saved stories
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/40_rls_saved_posts.sql
      - name: Apply R46 secret-free pilot invitation table to disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R46_POSTGRES_PILOT_INVITES_REFERENCE.sql
      - name: Verify private invite grants, 3 identities and atomic redemption
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/50_rls_pilot_invites.sql
      - name: Apply R51 owner-only preferences contract in disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R51_POSTGRES_NOTIFICATION_SETTINGS_REFERENCE.sql
      - name: Verify three identities, denied mutations, default booleans and deletion
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/60_rls_notification_preferences.sql
      - name: Apply R55 moderated media metadata to disposable Postgres only
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R55_PRIVATE_MEDIA_MANIFEST_REFERENCE.sql
      - name: Verify media ownership, digest path, quarantine, independent review and JWT denies
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/70_rls_private_media_manifest.sql
      - name: Assert the test database never targeted external infrastructure
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          test "${{ github.event_name }}" != "deployment"
