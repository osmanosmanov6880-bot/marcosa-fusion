name: "MARCOSA | disposable PostgreSQL RLS contract"
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql"
      - "docs/MARCOSA_R37_POSTGRES_ACTIVITY_APPEALS_REFERENCE.sql"
      - "docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql"
      - "docs/MARCOSA_R43_POSTGRES_BOOKMARKS_REFERENCE.sql"
      - "docs/MARCOSA_R46_POSTGRES_PILOT_INVITES_REFERENCE.sql"
      - "docs/MARCOSA_R51_POSTGRES_NOTIFICATION_SETTINGS_REFERENCE.sql"
      - "docs/MARCOSA_R55_PRIVATE_MEDIA_MANIFEST_REFERENCE.sql"
      - "docs/MARCOSA_R58_PRIVATE_MEDIA_APPEALS_REFERENCE.sql"
      - "docs/MARCOSA_R61_REVOKABLE_MEDIA_DELIVERY_REFERENCE.sql"
      - "docs/MARCOSA_R72_PRIVATE_APPROVED_MEDIA_REPORTS_REFERENCE.sql"
      - "docs/MARCOSA_R75_PRIVATE_RIGHTS_PG_DELIVERY_REFERENCE.sql"
      - "docs/MARCOSA_R84_BLOCK_INTERACTIONS_PG_REFERENCE.sql"
      - "tests/postgres/**"
      - "ops/r130_disposable_storage_restore.mjs"
      - "tests/r130_disposable_storage_restore.test.mjs"
      - "ops/r131_isolated_pg17_cluster_restore.mjs"
      - "tests/r131_isolated_pg17_cluster_restore.test.mjs"
      - "docs/MARCOSA_R131_CROSS_CLUSTER_DISASTER_RECOVERY_RU.md"
      - ".github/workflows/marcosa-postgres-rls-reference.yml"
  push:
    branches: [main]
    paths:
      - "docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql"
      - "docs/MARCOSA_R37_POSTGRES_ACTIVITY_APPEALS_REFERENCE.sql"
      - "docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql"
      - "docs/MARCOSA_R43_POSTGRES_BOOKMARKS_REFERENCE.sql"
      - "docs/MARCOSA_R46_POSTGRES_PILOT_INVITES_REFERENCE.sql"
      - "docs/MARCOSA_R51_POSTGRES_NOTIFICATION_SETTINGS_REFERENCE.sql"
      - "docs/MARCOSA_R55_PRIVATE_MEDIA_MANIFEST_REFERENCE.sql"
      - "docs/MARCOSA_R58_PRIVATE_MEDIA_APPEALS_REFERENCE.sql"
      - "docs/MARCOSA_R61_REVOKABLE_MEDIA_DELIVERY_REFERENCE.sql"
      - "docs/MARCOSA_R72_PRIVATE_APPROVED_MEDIA_REPORTS_REFERENCE.sql"
      - "docs/MARCOSA_R75_PRIVATE_RIGHTS_PG_DELIVERY_REFERENCE.sql"
      - "docs/MARCOSA_R84_BLOCK_INTERACTIONS_PG_REFERENCE.sql"
      - "tests/postgres/**"
      - "ops/r130_disposable_storage_restore.mjs"
      - "tests/r130_disposable_storage_restore.test.mjs"
      - "ops/r131_isolated_pg17_cluster_restore.mjs"
      - "tests/r131_isolated_pg17_cluster_restore.test.mjs"
      - "docs/MARCOSA_R131_CROSS_CLUSTER_DISASTER_RECOVERY_RU.md"
      - ".github/workflows/marcosa-postgres-rls-reference.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: local-ci-only-rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: local-ci-only-rls
    steps:
      - uses: actions/checkout@v4
      - name: Prove isolated PostgreSQL service is available
        run: |
          set -euo pipefail
          command -v psql
          psql -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version');"
      - name: Create simulated Auth roles in disposable CI database only
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/00_auth_fixture.sql
      - name: Execute reviewed R30 reference SQL against PostgreSQL 17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql
      - name: Test anon, three separate identities, ownership and forbidden writes
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/10_rls_isolation.sql
      - name: Create additive R37 activity and appeal RLS schema in isolated Postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R37_POSTGRES_ACTIVITY_APPEALS_REFERENCE.sql
      - name: Verify activity and appeals with three distinct identities
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/20_rls_activity_appeals.sql
      - name: Create R41 owner-only user block RLS in isolated PostgreSQL 17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql
      - name: Verify owner privacy and browser-denied block mutations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/30_rls_user_blocks.sql
      - name: Apply R43 saved stories privacy contract to disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R43_POSTGRES_BOOKMARKS_REFERENCE.sql
      - name: Test three owner identities, denied writes and FK cascade for saved stories
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/40_rls_saved_posts.sql
      - name: Apply R46 secret-free pilot invitation table to disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R46_POSTGRES_PILOT_INVITES_REFERENCE.sql
      - name: Verify private invite grants, 3 identities and atomic redemption
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/50_rls_pilot_invites.sql
      - name: Apply R51 owner-only preferences contract in disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R51_POSTGRES_NOTIFICATION_SETTINGS_REFERENCE.sql
      - name: Verify three identities, denied mutations, default booleans and deletion
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/60_rls_notification_preferences.sql
      - name: Apply R55 moderated media metadata to disposable Postgres only
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R55_PRIVATE_MEDIA_MANIFEST_REFERENCE.sql
      - name: Verify media ownership, digest path, quarantine, independent review and JWT denies
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/70_rls_private_media_manifest.sql
      - name: Apply R58 quarantined-cover appeal schema in disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R58_PRIVATE_MEDIA_APPEALS_REFERENCE.sql
      - name: Prove independent moderation appeal RLS, identity and media non-publication
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/80_private_media_appeals.sql
      - name: R61 private approved-media eligibility with revocable reviewer role
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R61_REVOKABLE_MEDIA_DELIVERY_REFERENCE.sql
      - name: Prove demotion and privacy remove eligible Storage keys, no browser ACL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/90_revocable_media_delivery.sql
      - name: Apply R72 private reporting and atomic published-media takedown SQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R72_PRIVATE_APPROVED_MEDIA_REPORTS_REFERENCE.sql
      - name: Prove three-reporter privacy, role independence and one-shot takedown in disposable PG17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/100_private_cover_reports.sql
      - name: Apply R75 private rights history with strict delivery eligibility
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R75_PRIVATE_RIGHTS_PG_DELIVERY_REFERENCE.sql
      - name: Confirm rights SHA, independent reviewer, replacement and deletion in disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/110_private_rights_delivery.sql
      - name: R84 install fail-closed reciprocal block eligibility and atomic relationship cleanup
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R84_BLOCK_INTERACTIONS_PG_REFERENCE.sql
      - name: R84 prove incoming/private block prevents follows and comments for actual PG client role
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/120_reciprocal_blocks_actions.sql
      - name: R128 reseed disposable restore-only accounts after R30-R84 cleanup tests
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          psql -v ON_ERROR_STOP=1 -f tests/postgres/129_pg17_restore_fixture_seed.sql
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: R130 test actual synthetic Storage bytes, restore tampering and tenant bounds
        run: |
          set -euo pipefail
          node --check ops/r130_disposable_storage_restore.mjs
          node --test tests/r130_disposable_storage_restore.test.mjs
      - name: R130 seed 2 SHA-named PNG blobs and PRIVATE metadata in disposable source PG17
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          node ops/r130_disposable_storage_restore.mjs seed
          test -s "$RUNNER_TEMP/marcosa-r130-media-fixtures.sql"
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/marcosa-r130-media-fixtures.sql"
      - name: R128 real disposable PG17 custom dump and restored RLS identity test
        shell: bash
        env:
          SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "osmanosmanov6880-bot/marcosa-fusion" ]] || exit 2
          [[ "$PGHOST" == "127.0.0.1" && "$PGPORT" == "5432" &&
             "$PGDATABASE" == "postgres" ]] || exit 2
          [[ "$SERVICE_CONTAINER" =~ ^[a-f0-9]{12,64}$ ]] || exit 2
          umask 077
          DUMP="$RUNNER_TEMP/marcosa-r128-only-synthetic-pg17.dump"
          trap 'rm -f -- "$DUMP" "$DUMP.sha256" "$DUMP.bad"' EXIT
          # Use the SAME PostgreSQL 17 client as the isolated service to avoid
          # pg_dump/server major-version mismatch. Never connect to any remote DB.
          docker exec -u postgres "$SERVICE_CONTAINER" \
            pg_dump -U postgres -d postgres --format=custom > "$DUMP"
          [[ -s "$DUMP" ]] || exit 2
          sha256sum "$DUMP" > "$DUMP.sha256"
          sha256sum -c "$DUMP.sha256"
          # Compare overall synthetic table cardinalities before and after restore.
          COUNTS_SQL="SELECT concat((SELECT count(*) FROM auth.users),':',(SELECT count(*) FROM public.marcosa_profiles),':',(SELECT count(*) FROM public.marcosa_worlds),':',(SELECT count(*) FROM public.marcosa_posts),':',(SELECT count(*) FROM public.marcosa_comments))"
          SOURCE_COUNTS="$(psql -v ON_ERROR_STOP=1 -Atc "$COUNTS_SQL")"
          psql -v ON_ERROR_STOP=1 -d postgres -c \
            'CREATE DATABASE marcosa_r128_restored TEMPLATE template0;'
          # Preserve ACLs and RLS policies: --no-acl would silently break testing.
          docker exec -u postgres -i "$SERVICE_CONTAINER" \
            pg_restore -U postgres --exit-on-error --no-owner \
            -d marcosa_r128_restored < "$DUMP"
          RESTORED_COUNTS="$(PGDATABASE=marcosa_r128_restored psql -v ON_ERROR_STOP=1 -Atc "$COUNTS_SQL")"
          [[ "$SOURCE_COUNTS" == "$RESTORED_COUNTS" ]] || {
            echo "::error::R128 restored row counts differ from synthetic source"
            exit 2
          }
          PGDATABASE=marcosa_r128_restored psql -v ON_ERROR_STOP=1 \
            -f tests/postgres/130_pg17_restore_rls_isolation.sql
          # Broken archives MUST be rejected, never treated as a valid snapshot.
          printf 'CORRUPT-NOT-A-DUMP' > "$DUMP.bad"
          if docker exec -u postgres -i "$SERVICE_CONTAINER" \
            pg_restore --list < "$DUMP.bad" >/dev/null 2>&1; then
            echo "::error::Damaged PostgreSQL backup unexpectedly accepted"
            exit 2
          fi
          printf '%s\n' \
            '{"format":"MARCOSA-R128-DISPOSABLE-PG17-RESTORE-v1","source":"synthetic-local-ci-only","pgDumpAndNewDbRestore":"PASS","restoredRlsMultipleIdentities":"PASS","corruptArchiveRejected":true,"realCustomerDataIncluded":false,"realSupabaseAuthOrStorageVerified":false,"productionCutoverAuthorized":false,"verdict":"NO_GO"}' \
            > marcosa-r128-disposable-restore-proof.json
          echo 'R128_PG17_DISPOSABLE_DUMP_RESTORE_RLS=PASS'
          echo 'R128_REAL_SUPABASE_BACKUP_RESTORE=NOT_VERIFIED'
          echo 'R128_PRODUCTION_CUTOVER=NO_GO'
      - name: R130 restore synthetic Storage files and cross-check independently restored PG17
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          node ops/r130_disposable_storage_restore.mjs backup
          node ops/r130_disposable_storage_restore.mjs restore
          PGDATABASE=marcosa_r128_restored psql -v ON_ERROR_STOP=1 \
            -f tests/postgres/131_r130_restored_storage_acl.sql
          node ops/r130_disposable_storage_restore.mjs attest
      - name: R131 validate two REAL different physical PostgreSQL cluster identities, no GO
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/r131_isolated_pg17_cluster_restore.mjs
          node --test tests/r131_isolated_pg17_cluster_restore.test.mjs
      - name: R131 restore actual synthetic custom dump into NEW no-network PG17 cluster
        shell: bash
        env:
          SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "osmanosmanov6880-bot/marcosa-fusion" ]] || exit 2
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 5432
          test "$PGDATABASE" = postgres
          node ops/r131_isolated_pg17_cluster_restore.mjs
      - name: Preserve only sanitized disposable-database restore acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r128-pg17-disposable-restore-proof
          path: marcosa-r128-disposable-restore-proof.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve only scrubbed synthetic Storage and restored PG17 acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r130-disposable-storage-recovery-proof
          path: marcosa-r130-disposable-storage-restore-proof.json
          retention-days: 7
          if-no-files-found: error
      - name: Save ONLY sanitized R131 cross-cluster NO_GO result, not backup bytes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r131-independent-pg17-cluster-restore-proof
          path: marcosa-r131-cross-cluster-disaster-recovery-proof.json
          retention-days: 7
          if-no-files-found: error
      - name: Assert the test database never targeted external infrastructure
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          test "${{ github.event_name }}" != "deployment"
