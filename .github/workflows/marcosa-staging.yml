name: "MARCOSA | Build, test and deploy STAGING"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-MARCOSA-STAGING for a human-requested static STAGING release"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "tools/**"
      - "scripts/activate-staging.sh"
      - "ops/staging-release-attestation.mjs"
      - "ops/staging-deploy-contract.mjs"
      - "ops/staging-live-readback.mjs"
      - "ops/load-pinned-staging-host.sh"
      - "ops/ssh/marcosa-staging-known-hosts"
      - ".github/workflows/marcosa-staging.yml"

permissions:
  contents: read

concurrency:
  group: marcosa-staging
  cancel-in-progress: false

jobs:
  build:
    # Build from reviewed main even when the source repository is public.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated source preview and tests
        shell: bash
        run: |
          set -euo pipefail
          # Public source build only: staging publication is a separate isolated job.
          test -f tools/build_webroot.py
          test -s site/index.html
          test -s site/network.js
          test -s site/network.css
          test -f tests/film_kit.test.cjs
          test -f tests/test_public_release.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned image-grade dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==12.0.0
      # Same independently reviewed source commits and deterministic compiler as PUBLIC Pages.
      # Without these, staging tests search for films which have not been generated.
      - name: Checkout original PROTOCOL ZERO cinema at pinned source SHA
        uses: actions/checkout@v4
        with:
          repository: osmanosmanov6880-bot/protocol-zero
          ref: 0f1841c0e56e47f7413bea9948e66200409e7a7a
          path: .r18-sources/protocol-zero
          persist-credentials: false
      - name: Checkout original ADVERSE JUDGE cinema at pinned source SHA
        uses: actions/checkout@v4
        with:
          repository: osmanosmanov6880-bot/adverse-judge
          ref: f48a00510984a3da2d5527cd01ef8a51f102881e
          path: .r18-sources/adverse-judge
          persist-credentials: false
      - name: Generate required source-pinned cinema snapshots for staging tests
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_cinema_r18.py --protocol-repo .r18-sources/protocol-zero --adverse-repo .r18-sources/adverse-judge
          test -s site/film-protocol-zero.html
          test -s site/film-adverse-judge.html
          node --test .r18-sources/protocol-zero/cinema/tests/engine.test.mjs
          node --test .r18-sources/adverse-judge/cinema/tests/engine.test.js
      - name: Verify Python and JS source
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_public_source.py
          python -m unittest discover -s tests -q
          node --check site/network.js
          node --check site/creator.js
          node --check site/creator-vault.js
          node --check site/creator-backup.js
          node --check site/creator-crypto.js
          node --check site/creator-standalone.js
          node --check site/film-network.js
          node --check site/film-continuity.js
          node --check site/source-hub.js
          node --check site/cinema-pilot.js
          node --check site/creator-playtest.js
          node --check site/marcosa-director.js
          node --check site/social-core.js
          node --check site/social-journal.js
          node --test tests/film_kit.test.cjs tests/immersive.test.cjs tests/r4_graphics.test.cjs tests/stories.test.cjs tests/creator.test.cjs tests/vault.test.cjs tests/backup.test.cjs tests/crypto.test.cjs tests/standalone.test.cjs tests/film_network.test.cjs tests/film_continuity.test.cjs tests/source_hub.test.cjs tests/cinema_pilot.test.cjs tests/brand_r21.test.cjs tests/r26_social_first.test.cjs tests/r27_journal.test.cjs tests/playtest.test.cjs
      - name: Build static webroot and reject sensitive files
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_webroot.py
          test -s dist/marcosa-director.css
          test -s dist/visual-city-director.webp
          test -s dist/index.html
          if find dist -type l -print -quit | grep -q .; then
            echo "::error::Symlinks forbidden in deploy artifact"
            exit 1
          fi
          if find dist -type f \( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite*' -o -name '*.db' \) -print -quit | grep -q .; then
            echo "::error::Potential secrets or database in build"
            exit 1
          fi
          # R90: Embed the reviewed source SHA and exact build-manifest digest
          # INSIDE the deployed archive, never as an unverified workflow claim.
          node --check ops/staging-release-attestation.mjs
          node ops/staging-release-attestation.mjs             --sha "$GITHUB_SHA"             --manifest dist/build-manifest.json             --output dist/staging-release.json
          test -s dist/staging-release.json
          cp dist/staging-release.json "staging-expected-${GITHUB_SHA}.json"
          tar -czf marcosa-site.tar.gz -C dist .
          test "$(stat -c '%s' marcosa-site.tar.gz)" -lt 200000000
          sha256sum marcosa-site.tar.gz > marcosa-site.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: marcosa-site-${{ github.sha }}
          path: |
            marcosa-site.tar.gz
            marcosa-site.tar.gz.sha256
            staging-expected-${{ github.sha }}.json
          retention-days: 7
          if-no-files-found: error

  deploy_staging:
    # R91: owner-requested continuous STAGING delivery from trusted main, never PR or production.
    needs: build
    # Staging is permitted from trusted main only. Remote marker + non-root
    # user + host pin enforce the actual release boundary, not repo visibility.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY-MARCOSA-STAGING'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: marcosa-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify trusted main push or explicitly confirmed manual isolated STAGING intent
        shell: bash
        env:
          APPROVAL: ${{ inputs.confirmation || '' }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {validateStagingDispatch} from "./ops/staging-deploy-contract.mjs";
            const p=validateStagingDispatch({
              repository:process.env.GITHUB_REPOSITORY,
              eventName:process.env.GITHUB_EVENT_NAME,
              ref:process.env.GITHUB_REF,
              sha:process.env.GITHUB_SHA,
              confirmation:process.env.APPROVAL
            });
            if(p.productionAuthorized)throw Error("STAGING cannot authorize production");
          '
      - uses: actions/download-artifact@v4
        with:
          name: marcosa-site-${{ github.sha }}
      - name: Verify deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c marcosa-site.tar.gz.sha256
      - name: Diagnose SSH and confirm remote staging readiness (read-only)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
          EXPECTED_DEPLOY_KEY_FP: SHA256:b6e0zrGwnTCu5yo9IZstiPw+5EGfahHgVpI3TWeccA0
          EXPECTED_STAGING_HOST: 169.58.48.38
        run: |
          set -euo pipefail
          source ops/load-pinned-staging-host.sh
          bash scripts/diagnose-staging-ssh.sh

      - name: Require independently approved public STAGING HTTPS target before upload
        shell: bash
        env:
          STAGING_ORIGIN: ${{ vars.MARCOSA_STAGING_ORIGIN }}
          STAGING_PUBLIC_HOST: ${{ vars.MARCOSA_STAGING_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          : "${STAGING_ORIGIN:?Set approved public STAGING HTTPS origin in environment variables}"
          : "${STAGING_PUBLIC_HOST:?Set independently approved STAGING public host in environment variables}"
          node --input-type=module -e '
            import {requireStagingOrigin} from "./ops/staging-live-readback.mjs";
            requireStagingOrigin(process.env.STAGING_ORIGIN,process.env.STAGING_PUBLIC_HOST);
            console.log("R91 STAGING HTTPS origin format accepted; public reachability checked AFTER deploy");
          '
      - name: Upload and atomically activate STAGING release
        id: ssh_activation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
          EXPECTED_DEPLOY_KEY_FP: SHA256:b6e0zrGwnTCu5yo9IZstiPw+5EGfahHgVpI3TWeccA0
          EXPECTED_STAGING_HOST: 169.58.48.38
        run: |
          set -euo pipefail
          source ops/load-pinned-staging-host.sh
          : "${DEPLOY_HOST:?Missing staging host secret}"
          [[ "$DEPLOY_HOST" == "$EXPECTED_STAGING_HOST" ]] || { echo "::error::Incorrect target VPS; MARCOSA STAGING is 169.58.48.38"; exit 2; }
          : "${DEPLOY_USER:?Missing staging user secret}"
          : "${DEPLOY_KEY:?Missing SSH private key secret}"
          : "${KNOWN_HOSTS:?Missing pinned host key secret}"
          : "${DEPLOY_HOST_FINGERPRINT:?Missing independently verified host fingerprint}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 2
          [[ "$DEPLOY_USER" == "marcosa-deploy" ]] || { echo "::error::Only marcosa-deploy is permitted"; exit 2; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/marcosa_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marcosa_deploy" "$HOME/.ssh/known_hosts"
          # The upload MUST use the same validated pin as the separate preflight.
          node ops/verify-staging-host-key.mjs --hostname "$DEPLOY_HOST" \
            --port "$DEPLOY_PORT" --known-hosts "$HOME/.ssh/known_hosts" \
            --expected "$DEPLOY_HOST_FINGERPRINT"
          ssh-keygen -y -P '' -f "$HOME/.ssh/marcosa_deploy" >/dev/null
          ACTUAL_DEPLOY_KEY_FP="$(ssh-keygen -y -P '' -f "$HOME/.ssh/marcosa_deploy" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          [[ "$ACTUAL_DEPLOY_KEY_FP" == "$EXPECTED_DEPLOY_KEY_FP" ]] || { echo "::error::GitHub SSH key does not match server-approved deploy public key"; exit 2; }
          SSH_ARGS=(-i "$HOME/.ssh/marcosa_deploy" -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes -o ConnectTimeout=12)
          SCP_ARGS=(-i "$HOME/.ssh/marcosa_deploy" -P "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes -o ConnectTimeout=12)
          ssh "${SSH_ARGS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'sh -s' <<'REMOTE'
          set -eu
          test "$(id -un)" = "marcosa-deploy"
          ROOT="$HOME/marcosa-staging"
          test -d "$ROOT" && test ! -L "$ROOT"
          test -f "$ROOT/.staging-approved"
          test "$(cat "$ROOT/.staging-approved")" = "MARCOSA-STAGING-APPROVED-v1"
          test -d "$ROOT/incoming" && test -d "$ROOT/releases"
          REMOTE
          scp "${SCP_ARGS[@]}" marcosa-site.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:marcosa-staging/incoming/$GITHUB_SHA.tar.gz"
          DIGEST="$(sha256sum marcosa-site.tar.gz | awk '{print $1}')"
          ssh "${SSH_ARGS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $GITHUB_SHA $DIGEST" < scripts/activate-staging.sh
          # Validate the active isolated symlink before reporting success.
          if ! ssh "${SSH_ARGS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sh -s -- $GITHUB_SHA" <<'VERIFY'
          set -eu
          SHA="$1"
          ROOT="$HOME/marcosa-staging"
          test "$(readlink "$ROOT/current")" = "releases/$SHA"
          for name in index.html network.js network.css immersive.js immersive.css stories.html stories.js stories.css creator.html creator.js creator.css creator-vault.js creator-backup.js creator-crypto.js creator-standalone.js creator-playtest.js film-network.html film-network.css film-network.js film-continuity.js source-hub.html source-hub.css source-hub.js cinema-pilot.html cinema-pilot.css cinema-pilot.js film-internet-v-humanity.html build-manifest.json staging-release.json; do
            test -s "$ROOT/current/$name" || {
              printf 'Missing staging asset: %s\n' "$name" >&2
              exit 10
            }
          done
          # Verify the active release digest AND actual bytes on SSH filesystem.
          # This is necessary, but not equivalent to public HTTPS readback.
          python3 - "$ROOT/current" "$SHA" <<'R90_VERIFY'
          import hashlib
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          expected_sha = sys.argv[2]
          proof = json.loads((root / "staging-release.json").read_text("utf-8"))
          man_bytes = (root / "build-manifest.json").read_bytes()
          manifest = json.loads(man_bytes)
          if (proof.get("format") != "MARCOSA-STAGING-READBACK-v1" or
              proof.get("sourceSha") != expected_sha or
              proof.get("productionAuthorized") is not False or
              proof.get("releaseKind") != "public_static_preview_only" or
              proof.get("buildManifestSha256") != hashlib.sha256(man_bytes).hexdigest()):
              raise SystemExit("R90 activated STAGING provenance mismatch")
          if manifest.get("release_kind") != "public_static_preview_only":
              raise SystemExit("R90 unexpected static release kind")
          if proof.get("assetsCount") != len(manifest.get("files", {})):
              raise SystemExit("R90 activated manifest file count mismatch")
          for asset in ["index.html", "network.js", "network.css"]:
              digest = hashlib.sha256((root / asset).read_bytes()).hexdigest()
              if manifest["files"].get(asset) != digest:
                  raise SystemExit("R90 activated asset bytes mismatch: " + asset)
          R90_VERIFY
          printf 'STAGING_VERIFIED_RELEASE=%s\n' "$SHA"
          printf 'STAGING_LOCATION=%s\n' "$ROOT/current"
          VERIFY
          then
            echo "::error title=Staging post-deploy verification failed::Attempting staging-only rollback."
            ssh "${SSH_ARGS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < scripts/rollback-staging.sh || true
            exit 1
          fi
          echo "::notice title=Isolated staging complete::Files are active under marcosa-deploy only. A public domain or production Nginx has NOT been changed."
      - name: Independently verify hosted STAGING HTTPS bytes against trusted GitHub build artifact
        id: hosted_readback
        shell: bash
        env:
          STAGING_ORIGIN: ${{ vars.MARCOSA_STAGING_ORIGIN }}
          STAGING_PUBLIC_HOST: ${{ vars.MARCOSA_STAGING_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          # Expected digest comes from the TRUSTED Actions artifact, NOT the web server.
          EXPECTED_MANIFEST_SHA256="$(node -p 'JSON.parse(require("node:fs").readFileSync("staging-expected-"+process.env.GITHUB_SHA+".json","utf8")).buildManifestSha256')"
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Trusted build manifest digest missing"; exit 2; }
          node ops/staging-live-readback.mjs \
            --origin "$STAGING_ORIGIN" --host "$STAGING_PUBLIC_HOST" \
            --sha "$GITHUB_SHA" --manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
          echo "::notice title=R91 hosted STAGING verified::Actual public HTTPS bytes match reviewed source and GitHub build manifest. NOT production."
      - name: Roll back isolated STAGING when external HTTPS readback fails
        if: failure() && steps.ssh_activation.outcome == 'success'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
          EXPECTED_DEPLOY_KEY_FP: SHA256:b6e0zrGwnTCu5yo9IZstiPw+5EGfahHgVpI3TWeccA0
          EXPECTED_STAGING_HOST: 169.58.48.38
        run: |
          set -euo pipefail
          source ops/load-pinned-staging-host.sh
          [[ "$DEPLOY_USER" == "marcosa-deploy" ]] || exit 2
          [[ "$DEPLOY_HOST" == "$EXPECTED_STAGING_HOST" ]] || { echo "::error::Wrong rollback target"; exit 2; }
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/marcosa_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marcosa_deploy" "$HOME/.ssh/known_hosts"
          node ops/verify-staging-host-key.mjs --hostname "$DEPLOY_HOST" \
            --port "$DEPLOY_PORT" --known-hosts "$HOME/.ssh/known_hosts" \
            --expected "$DEPLOY_HOST_FINGERPRINT"
          ACTUAL_DEPLOY_KEY_FP="$(ssh-keygen -y -P '' -f "$HOME/.ssh/marcosa_deploy" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          [[ "$ACTUAL_DEPLOY_KEY_FP" == "$EXPECTED_DEPLOY_KEY_FP" ]] || { echo "::error::Invalid rollback deploy identity"; exit 2; }
          SSH_ARGS=(-i "$HOME/.ssh/marcosa_deploy" -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes -o ConnectTimeout=12)
          ssh "${SSH_ARGS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < scripts/rollback-staging.sh
          echo "::warning::STAGING rollback executed after failed public readback. Production was untouched."
