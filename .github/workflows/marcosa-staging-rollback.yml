name: "MARCOSA | Roll back STAGING"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROLLBACK-STAGING to restore previous staging release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marcosa-staging
  cancel-in-progress: false

jobs:
  rollback_staging:
    if: github.event.repository.private == true && vars.MARCOSA_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marcosa-staging
    steps:
      - uses: actions/checkout@v4
      - name: Verify intent and perform a staging-only rollback
        shell: bash
        env:
          REQUEST: ${{ inputs.confirmation }}
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.MARCOSA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MARCOSA_SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$REQUEST" == "ROLLBACK-STAGING" ]] || exit 2
          [[ "$DEPLOY_USER" == "marcosa-deploy" ]] || exit 2
          : "${DEPLOY_HOST:?Missing staging host}"
          : "${DEPLOY_KEY:?Missing key}"
          : "${KNOWN_HOSTS:?Missing host key}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 2
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/marcosa_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/marcosa_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/marcosa_deploy" >/dev/null
          ssh -i "$HOME/.ssh/marcosa_deploy" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=12 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < scripts/rollback-staging.sh
