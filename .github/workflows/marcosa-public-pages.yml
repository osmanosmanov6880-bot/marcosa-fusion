name: "MARCOSA | Publish public Network OS preview"

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "tools/build_webroot.py"
      - ".github/workflows/marcosa-public-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "tools/build_webroot.py"
      - ".github/workflows/marcosa-public-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marcosa-public-preview-pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public preview code and build
        shell: bash
        run: |
          set -euo pipefail
          node --check site/network.js
          node --check site/immersive.js
          node --check site/stories.js
          node --test tests/film_kit.test.cjs tests/immersive.test.cjs tests/r4_graphics.test.cjs tests/stories.test.cjs
          python tools/audit_public_source.py
          python -m unittest discover -s tests -q
          python tools/build_webroot.py
          test -s dist/index.html
          test -s dist/network.js
          test -s dist/network.css
          test -s dist/immersive.js
          test -s dist/immersive.css
          test -s dist/stories.html
          test -s dist/stories.css
          test -s dist/stories.js
          python tools/r4_browser_smoke.py
          python tools/r5_browser_smoke.py
      - name: Capture R4 Chromium render evidence (desktop / mobile / static)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python tools/r4_capture_preview.py
      - name: Upload browser screenshots for visual QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r4-visual-qa
          path: qa-r4/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  publish:
    needs: verify-and-build
    # GitHub Pages requires a one-time Settings > Pages enablement.
    # Keep builds green until the owner explicitly enables the Pages preview.
    if: github.event_name != 'pull_request' && vars.MARCOSA_PUBLIC_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (requires Pages enabled in repo settings)
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
