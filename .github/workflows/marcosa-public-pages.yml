name: "MARCOSA | Publish public Network OS preview"

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "tools/build_webroot.py"
      - "tools/build_cinema_r18.py"
      - "tools/r18_multicinema_cdp.cjs"
      - "tools/r19_three_archives_cdp.cjs"
      - "tools/r21_brand_cdp.cjs"
      - "tools/r22_reference_cdp.cjs"
      - "tools/r23_luxury_cdp.cjs"
      - "tools/r22_extract_cinematic_assets.py"
      - "tools/r5_browser_smoke.py"
      - "inventory/playable_cinema_r19.json"
      - ".github/workflows/marcosa-public-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "tools/build_webroot.py"
      - "tools/build_cinema_r18.py"
      - "tools/r18_multicinema_cdp.cjs"
      - "tools/r19_three_archives_cdp.cjs"
      - "tools/r21_brand_cdp.cjs"
      - "tools/r22_reference_cdp.cjs"
      - "tools/r23_luxury_cdp.cjs"
      - "tools/r22_extract_cinematic_assets.py"
      - "tools/r5_browser_smoke.py"
      - "inventory/playable_cinema_r19.json"
      - ".github/workflows/marcosa-public-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marcosa-public-preview-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout original PROTOCOL ZERO cinema at reviewed Git SHA
        uses: actions/checkout@v4
        with:
          repository: osmanosmanov6880-bot/protocol-zero
          ref: 0f1841c0e56e47f7413bea9948e66200409e7a7a
          path: .r18-sources/protocol-zero
          persist-credentials: false
      - name: Checkout original ADVERSE JUDGE cinema at reviewed Git SHA
        uses: actions/checkout@v4
        with:
          repository: osmanosmanov6880-bot/adverse-judge
          ref: f48a00510984a3da2d5527cd01ef8a51f102881e
          path: .r18-sources/adverse-judge
          persist-credentials: false
      - name: Generate standalone source-pinned cinema with all 38 original WebP frames
        run: |
          set -euo pipefail
          python tools/build_cinema_r18.py --protocol-repo .r18-sources/protocol-zero --adverse-repo .r18-sources/adverse-judge
          test -s site/film-protocol-zero.html
          test -s site/film-adverse-judge.html
          node --test .r18-sources/protocol-zero/cinema/tests/engine.test.mjs
          node --test .r18-sources/adverse-judge/cinema/tests/engine.test.js
      - name: Verify public preview code and build
        shell: bash
        run: |
          set -euo pipefail
          node --check site/network.js
          node --check site/immersive.js
          node --check site/stories.js
          node --check site/creator.js
          node --check site/creator-vault.js
          node --check site/creator-backup.js
          node --check site/creator-crypto.js
          node --check site/creator-standalone.js
          node --check site/film-network.js
          node --check site/film-continuity.js
          node --check site/source-hub.js
          node --check site/cinema-pilot.js
          node --check site/marcosa-brand.js
          node --check site/social-core.js
          node --check tools/r21_brand_cdp.cjs
          node --check tools/r22_reference_cdp.cjs
          node --check site/marcosa-gateway.js
          node --check site/marcosa-quiet.js
          node --check tools/r23_luxury_cdp.cjs
          node --check tools/cinema_release_gate_r17.cjs
          node tools/cinema_release_gate_r17.cjs
          node --check tools/r16_cinema_cdp.cjs
          node --check tools/r18_multicinema_cdp.cjs
          node --check tools/r19_three_archives_cdp.cjs
          node --check tools/r14_film_cdp.cjs
          node --check site/creator-playtest.js
          node --check tools/r9_cdp_smoke.cjs
          node --check tools/r12_offline_cdp.cjs
          node --test tests/film_kit.test.cjs tests/immersive.test.cjs tests/r4_graphics.test.cjs tests/stories.test.cjs tests/creator.test.cjs tests/vault.test.cjs tests/backup.test.cjs tests/crypto.test.cjs tests/standalone.test.cjs tests/film_network.test.cjs tests/film_continuity.test.cjs tests/source_hub.test.cjs tests/cinema_pilot.test.cjs tests/cinema_gate_r17.test.cjs tests/cinema_r18.test.cjs tests/cinema_r19.test.cjs tests/brand_r21.test.cjs tests/r22_reference.test.cjs tests/r23_quiet_social.test.cjs tests/playtest.test.cjs
          python tools/audit_public_source.py
          python -m unittest discover -s tests -q
          python tools/build_webroot.py
          test -s dist/index.html
          test -s dist/network.js
          test -s dist/network.css
          test -s dist/immersive.js
          test -s dist/immersive.css
          test -s dist/stories.html
          test -s dist/stories.css
          test -s dist/stories.js
          test -s dist/creator.html
          test -s dist/creator.css
          test -s dist/creator.js
          test -s dist/creator-vault.js
          test -s dist/creator-backup.js
          test -s dist/creator-crypto.js
          test -s dist/creator-standalone.js
          test -s dist/film-network.html
          test -s dist/film-network.css
          test -s dist/film-network.js
          test -s dist/film-continuity.js
          test -s dist/source-hub.html
          test -s dist/source-hub.css
          test -s dist/source-hub.js
          test -s dist/cinema-pilot.html
          test -s dist/cinema-pilot.css
          test -s dist/cinema-pilot.js
          test -s dist/film-internet-v-humanity.html
          test -s dist/film-protocol-zero.html
          test -s dist/film-adverse-judge.html
          test -s dist/film-signal-worlds.html
          test -s dist/film-opspilot.html
          test -s dist/film-intentgraph.html
          test -s dist/social.html
          test -s dist/social-core.css
          test -s dist/social-core.js
          test -s dist/marcosa-mark.svg
          test -s dist/marcosa-brand.css
          test -s dist/marcosa-brand.js
          test -s dist/marcosa-gateway.js
          test -s dist/marcosa-cinematic.css
          test -s dist/marcosa-quiet.css
          test -s dist/marcosa-quiet.js
          test -s dist/visual-station.webp
          test -s dist/visual-cascade.webp
          test -s dist/visual-hero.webp
          test -s dist/visual-archive.webp
          test -s dist/visual-control.webp
          test -s dist/visual-city.webp
          test -s dist/visual-earthrise.webp
          test -s dist/visual-operator.webp
          test -s dist/creator-playtest.js
          python tools/r4_browser_smoke.py
          python tools/r5_browser_smoke.py
          node tools/r9_cdp_smoke.cjs
          node tools/r12_offline_cdp.cjs
          node tools/r14_film_cdp.cjs
          node tools/r16_cinema_cdp.cjs
          node tools/r18_multicinema_cdp.cjs
          node tools/r19_three_archives_cdp.cjs
          node tools/r21_brand_cdp.cjs
          node tools/r23_luxury_cdp.cjs
      - name: Capture R4 Chromium render evidence (desktop / mobile / static)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python tools/r4_capture_preview.py
      - name: Upload browser screenshots for visual QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r4-visual-qa
          path: qa-r4/
          retention-days: 7
          if-no-files-found: warn
      - name: Render R5 story experiences on desktop and mobile
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python tools/r5_capture_preview.py
      - name: Upload R5 visual QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r5-visual-qa
          path: qa-r5/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R14 browser recovery screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r14-film-audit-qa
          path: qa-r14/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R16 actual cinema player screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r16-real-cinema-qa
          path: qa-r16/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R18 three-film desktop/mobile browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r18-three-interactive-films-qa
          path: qa-r18/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R19 three original archive cinemas QA desktop/mobile
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r19-signal-opspilot-intentgraph-qa
          path: qa-r19/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R21 brand and Social Core desktop/mobile screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r21-marcosa-brand-worlds-qa
          path: qa-r21/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R22 original-source cinematic reference screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r22-marcosa-cinematic-reference-desktop-mobile
          path: qa-r22/
          retention-days: 7
          if-no-files-found: error
      - name: Upload R23 quiet-luxury desktop/mobile browser screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r23-marcosa-quiet-luxury-social-qa
          path: qa-r23/
          retention-days: 7
          if-no-files-found: error
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  publish:
    needs: verify-and-build
    # Public source deploys from trusted main, independently of SSH staging keys.
    # Pages source must be enabled once in Settings > Pages > GitHub Actions.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Explain one-time GitHub Pages setup
        if: steps.configure.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=GitHub Pages needs one-time enablement::Open Settings > Pages > Build and deployment > Source > GitHub Actions. No private key or SSH configuration is needed for the public preview."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show deployment URL and release identity
        env:
          RELEASE_SHA: ${{ github.sha }}
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "MARCOSA_PREVIEW_RELEASE_SHA=$RELEASE_SHA"
          echo "MARCOSA_PUBLIC_URL=$LIVE_URL"
          test -n "$LIVE_URL"
      - name: Explain failed Pages upload (if any)
        if: failure()
        run: |
          echo "::notice title=Pages troubleshooting::If this is the first deployment, select GitHub Actions as the Pages Source in repository Settings. Repository secret keys do not enable Pages."
