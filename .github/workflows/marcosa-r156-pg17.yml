name: "MARCOSA | R156 isolated PostgreSQL writer and outbox"
on:
  pull_request:
    paths:
      - "docs/MARCOSA_R156_*"
      - "tests/postgres/157_r156_*"
      - "tests/postgres/158_r156_*"
      - "tests/postgres/159_r156_*"
      - "ops/r156/**"
      - "ops/test/r156.*"
      - ".github/workflows/marcosa-r156-pg17.yml"
  push:
    branches: ["feature/**", "codex/**"]
    paths:
      - "docs/MARCOSA_R156_*"
      - "tests/postgres/157_r156_*"
      - "tests/postgres/158_r156_*"
      - "tests/postgres/159_r156_*"
      - "ops/r156/**"
      - "ops/test/r156.*"
      - ".github/workflows/marcosa-r156-pg17.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transactional-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: r156-disposable-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: r156-disposable-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject unknown PostgreSQL/remote target
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "osmanosmanov6880-bot/marcosa-fusion"
          test "$PGHOST" = "127.0.0.1"
          test "$PGPORT" = "5432"
          test "$PGDATABASE" = "postgres"
          test "$PGUSER" = "postgres"
          psql -v ON_ERROR_STOP=1 -Atc "SELECT current_setting('server_version_num')::int>=170000" | grep -qx t
      - name: Install fake Auth, worlds, private blocks and R155 PostgreSQL reference
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/00_auth_fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R30_POSTGRES_RLS_REFERENCE.sql
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R41_POSTGRES_BLOCKS_REFERENCE.sql
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R84_BLOCK_INTERACTIONS_PG_REFERENCE.sql
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R155_PG17_CREATOR_RLS_REFERENCE.sql
      - name: Install private R156 writer, outbox and consent controls
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R156_TRUSTED_WRITER_REFERENCE.sql
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R156_OUTBOX_REFERENCE.sql
          psql -v ON_ERROR_STOP=1 -f docs/MARCOSA_R156_READER_PRIVACY_REFERENCE.sql
      - name: Verify RLS, idempotent metadata and optimistic reorders
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/157_r156_writer_editor.sql
      - name: Verify user-controlled deletion and token-fenced notification outbox
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/158_r156_reader_outbox.sql
      - name: Run actual concurrent editing and SKIP LOCKED workers
        run: |
          set -euo pipefail
          node --test ops/test/r156.*.test.mjs
          node ops/r156/concurrency.mjs
      - name: Real PG17 custom backup, restored RLS and damaged archive refusal
        env:
          SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          [[ "$SERVICE_CONTAINER" =~ ^[a-f0-9]{12,64}$ ]] || exit 2
          umask 077
          DUMP="$RUNNER_TEMP/r156-disposable.dump"
          trap 'rm -f -- "$DUMP" "$DUMP.sha256" "$DUMP.corrupt"' EXIT
          docker exec -u postgres "$SERVICE_CONTAINER" \
            pg_dump -U postgres -d postgres --format=custom > "$DUMP"
          test -s "$DUMP"
          sha256sum "$DUMP" > "$DUMP.sha256"
          sha256sum -c "$DUMP.sha256"
          COUNTS="SELECT concat(
            (SELECT count(*) FROM public.marcosa_seasons),':',
            (SELECT count(*) FROM marcosa_private.r156_commands),':',
            (SELECT count(*) FROM marcosa_private.r156_outbox),':',
            (SELECT count(*) FROM public.marcosa_season_audit))"
          BEFORE="$(psql -v ON_ERROR_STOP=1 -Atc "$COUNTS")"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE marcosa_r156_restored TEMPLATE template0;"
          docker exec -u postgres -i "$SERVICE_CONTAINER" \
            pg_restore -U postgres --exit-on-error --no-owner \
            -d marcosa_r156_restored < "$DUMP"
          AFTER="$(PGDATABASE=marcosa_r156_restored psql -v ON_ERROR_STOP=1 -Atc "$COUNTS")"
          test "$BEFORE" = "$AFTER"
          PGDATABASE=marcosa_r156_restored psql -v ON_ERROR_STOP=1 \
            -f tests/postgres/159_r156_restored_integrity.sql
          printf 'NOT-A-PG-DUMP' > "$DUMP.corrupt"
          if docker exec -u postgres -i "$SERVICE_CONTAINER" \
            pg_restore --list < "$DUMP.corrupt" >/dev/null 2>&1; then
            echo "::error::Damaged PostgreSQL dump accepted"
            exit 1
          fi
          echo 'R156_PG17_RESTORE_RLS_AND_PRIVATE_WRITES=PASS'
          echo 'R156_REAL_AUTH_OR_PRODUCTION_DEPLOY=NO_GO'
      - name: Save synthetic concurrency proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r156-disposable-concurrency-proof
          path: ${{ runner.temp }}/marcosa-r156-concurrency-proof.json
          if-no-files-found: error
          retention-days: 7
