name: "MARCOSA | isolated social lab checks"

on:
  push:
    branches:
      - "feature/**"
      - "codex/**"
    paths:
      - "server-lab/**"
      - "tools/finance/**"
      - ".github/workflows/marcosa-r150-lab.yml"
  pull_request:
    paths:
      - "server-lab/**"
      - "tools/finance/**"
      - ".github/workflows/marcosa-r150-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marcosa-lab-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-http-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find server-lab -type f \( -name '*.mjs' -o -name '*.js' \) -print0)
      - name: Run local HTTP, SQLite, privacy and UI regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test server-lab/test/*.test.mjs
          node --test tools/finance/model.test.mjs
