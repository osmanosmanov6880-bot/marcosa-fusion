name: "MARCOSA | R132 exact main source vs legacy root (READ ONLY, MANUAL)"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/marcosa-r100-production-readonly-compat.yml"
      - "ops/r132_current_main_readonly_parity.mjs"
      - "tests/r132_current_main_readonly_parity.test.mjs"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUDIT-PRODUCTION-READONLY for read-only SSH audit"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify R132 safe audit negative tests without SSH
        run: |
          set -euo pipefail
          node --check ops/r132_current_main_readonly_parity.mjs
          node --test tests/r132_current_main_readonly_parity.test.mjs
  production-compat-readonly:
    needs: offline-contract
    if: github.repository == 'osmanosmanov6880-bot/marcosa-fusion' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'AUDIT-PRODUCTION-READONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marcosa-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bind comparison to the exact CURRENT main source and SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "osmanosmanov6880-bot/marcosa-fusion" ]] || exit 2
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || exit 2
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || exit 2
          [[ -f site/index.html && ! -L site/index.html ]] || exit 2
          SOURCE_INDEX_SHA="$(sha256sum site/index.html | awk '{print $1}')"
          SOURCE_INDEX_BYTES="$(stat -c %s site/index.html)"
          [[ "$SOURCE_INDEX_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 2
          [[ "$SOURCE_INDEX_BYTES" =~ ^[1-9][0-9]{0,9}$ ]] || exit 2
          echo "SOURCE_INDEX_SHA=$SOURCE_INDEX_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_INDEX_BYTES=$SOURCE_INDEX_BYTES" >> "$GITHUB_ENV"
      - name: Compare exact current MAIN SOURCE with untouched root-owned legacy production
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.MARCOSA_STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.MARCOSA_STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ vars.MARCOSA_STAGING_PORT || '22' }}
          EXPECTED_DEPLOY_KEY_FP: SHA256:b6e0zrGwnTCu5yo9IZstiPw+5EGfahHgVpI3TWeccA0
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" == "marcosa-deploy" ]] || exit 2
          source ops/load-pinned-staging-host.sh
          [[ "$SOURCE_INDEX_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 2
          [[ "$SOURCE_INDEX_BYTES" =~ ^[1-9][0-9]{0,9}$ ]] || exit 2
          umask 077
          TMP="$(mktemp -d)"
          trap 'rm -rf -- "$TMP"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$TMP/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$TMP/known_hosts"
          chmod 600 "$TMP/key" "$TMP/known_hosts"
          FP="$(ssh-keygen -y -P '' -f "$TMP/key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          [[ "$FP" == "$EXPECTED_DEPLOY_KEY_FP" ]] || exit 2
          node ops/verify-staging-host-key.mjs --hostname "$DEPLOY_HOST" --port "$DEPLOY_PORT" --known-hosts "$TMP/known_hosts" --expected "$DEPLOY_HOST_FINGERPRINT"
          SSH_ARGS=(-i "$TMP/key" -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$TMP/known_hosts" -o BatchMode=yes -o ConnectTimeout=12)
          REPORT="$(ssh "${SSH_ARGS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == "marcosa-deploy" ]] || exit 2
          LIVE="/opt/marcosa/current"
          [[ -d "$LIVE" && -f "$LIVE/index.html" ]] || exit 2
          [[ -r "$LIVE/index.html" ]] || exit 2
          echo "ROOT_PATH=$LIVE"
          echo "ROOT_OWNER=$(stat -c %U:%G "$LIVE")"
          if [[ -w "$LIVE" ]]; then echo "DEPLOY_USER_CAN_WRITE_PRODUCTION=YES"; else echo "DEPLOY_USER_CAN_WRITE_PRODUCTION=NO"; fi
          echo "LIVE_INDEX_SHA256=$(sha256sum "$LIVE/index.html" | awk '{print $1}')"
          echo "LIVE_INDEX_BYTES=$(stat -c %s "$LIVE/index.html")"
          echo "LIVE_TOPLEVEL_SOURCE_COUNT=$(find "$LIVE" -maxdepth 1 -type f | wc -l)"
          LEGACY_COMPONENTS=0
          for file in marcosa-config.js marcosa-supabase.js interaction-bridge.js developer-console.js nexus.js supabase scripts; do
            if [[ -e "$LIVE/$file" && ! -L "$LIVE/$file" ]]; then
              echo "PRODUCTION_COMPONENT_PRESENT=$file"
              LEGACY_COMPONENTS=$((LEGACY_COMPONENTS+1))
            fi
          done
          echo "PRODUCTION_DISTINCT_COMPONENT_COUNT=$LEGACY_COMPONENTS"
          echo "PRODUCTION_AUDIT_ONLY=YES"
          REMOTE
          )"
          # Never print raw SSH output: verify exact allowlisted fields first.
          printf '%s\n' "$REPORT" | node ops/r132_current_main_readonly_parity.mjs
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('marcosa-r132-current-sha-readonly.json'));if(r.sourceSha!==process.env.RELEASE_SHA||r.productionDecision!=='NO_GO'||r.productionCutoverAuthorized!==false||r.authJwtCookiesAndApiRuntimeParityProven!==false)process.exit(2)"
          {
            echo "### MARCOSA R132 — current main source vs untouched legacy root"
            echo "- Exact checked-out main SHA: $RELEASE_SHA"
            echo "- Public index source SHA-256: $SOURCE_INDEX_SHA"
            echo "- Old root is read-only and root-owned: VERIFIED"
            echo "- Indexed SOURCE and legacy root are compared; runtime/Auth/API parity: NOT VERIFIED"
            echo "- NO_GO: static source comparison cannot approve migration"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve only bounded R132 NO_GO source comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r132-current-main-readonly-compat
          path: marcosa-r132-current-sha-readonly.json
          retention-days: 7
          if-no-files-found: error
