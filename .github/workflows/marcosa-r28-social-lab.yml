name: "MARCOSA | real social server + World/Ads lab"
on:
  push:
    branches: [main]
    paths:
      - "server-lab/**"
      - ".github/workflows/marcosa-r28-social-lab.yml"
  pull_request:
    branches: [main]
    paths:
      - "server-lab/**"
      - ".github/workflows/marcosa-r28-social-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marcosa-community-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and zero-dependency check
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/server.mjs
          node --check server-lab/public/app.js
          node --check server-lab/public/i18n.js
          node --check server-lab/test/core.test.mjs
          test -s server-lab/public/index.html
          test -s server-lab/public/style.css
          test -s server-lab/package.json
          test ! -d server-lab/node_modules
      - name: Real two-user HTTP, SQLite, moderation and isolation tests
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r30.community_ads.test.mjs
          node --check server-lab/test/r30.migration.test.mjs
          node --check server-lab/test/r31.following_activity.test.mjs
          node --check server-lab/test/r32.moderation_appeals.test.mjs
          node --check server-lab/tools/lab-snapshot.mjs
          node --check server-lab/test/r34.snapshot.test.mjs
          node --check server-lab/test/r33.world_insights.test.mjs
          node --check server-lab/test/r36.loopback_security.test.mjs
          node --check server-lab/test/r39.account_security.test.mjs
          node --check server-lab/test/r40.community_blocks.test.mjs
          node --check server-lab/test/r42.bookmarks.test.mjs
          node --check server-lab/test/r45.pilot_onboarding.test.mjs
          node --check server-lab/test/r47.pilot_metrics.test.mjs
          node --check server-lab/test/r50.notification_preferences.test.mjs
          node --check server-lab/test/r52.world_topics.test.mjs
          node --check server-lab/test/r52.legacy_world_upgrade.test.mjs
          node --check server-lab/media/safe-png.mjs
          node --check server-lab/test/r54.safe_world_covers.test.mjs
          node --check server-lab/test/r56.world_deep_links.test.mjs
          node --check server-lab/test/r57.cover_review.test.mjs
          node --check server-lab/test/r57.legacy_media_upgrade.test.mjs
          node --check server-lab/test/r59.media_appeals.test.mjs
          node --check server-lab/test/r62.beta_retention.test.mjs
          node --check server-lab/test/r65.cover_takedown_reports.test.mjs server-lab/test/r68.world_pages.test.mjs server-lab/test/r69.moderation_operations.test.mjs
          node --check server-lab/test/r68.world_pages.test.mjs
          node --check server-lab/ops/moderation-queue-health.mjs
          node --check server-lab/test/r69.moderation_operations.test.mjs
          node --check server-lab/test/r74.media_rights_attestation.test.mjs
          node --check server-lab/tools/bootstrap-moderator.mjs
          node --test server-lab/test/core.test.mjs server-lab/test/r30.community_ads.test.mjs server-lab/test/r30.migration.test.mjs server-lab/test/r31.following_activity.test.mjs server-lab/test/r32.moderation_appeals.test.mjs server-lab/test/r34.snapshot.test.mjs server-lab/test/r33.world_insights.test.mjs server-lab/test/r36.loopback_security.test.mjs server-lab/test/r39.account_security.test.mjs server-lab/test/r40.community_blocks.test.mjs server-lab/test/r42.bookmarks.test.mjs server-lab/test/r45.pilot_onboarding.test.mjs server-lab/test/r47.pilot_metrics.test.mjs server-lab/test/r50.notification_preferences.test.mjs server-lab/test/r52.world_topics.test.mjs server-lab/test/r52.legacy_world_upgrade.test.mjs server-lab/test/r54.safe_world_covers.test.mjs server-lab/test/r56.world_deep_links.test.mjs server-lab/test/r57.cover_review.test.mjs server-lab/test/r57.legacy_media_upgrade.test.mjs server-lab/test/r59.media_appeals.test.mjs server-lab/test/r62.beta_retention.test.mjs server-lab/test/r65.cover_takedown_reports.test.mjs server-lab/test/r74.media_rights_attestation.test.mjs
      - name: Real Chromium — desktop and phones, signup, login, publish
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/browser-cdp.mjs
          node server-lab/test/browser-cdp.mjs
      - name: R60 actual image upload, appeal and two-moderator Chromium E2E (three screen sizes)
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r60.media_browser_cdp.mjs
          node server-lab/test/r60.media_browser_cdp.mjs
      - name: R65 published PNG complaint with independent reviewer in actual Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r65.cover_reports_browser_cdp.mjs
          node server-lab/test/r65.cover_reports_browser_cdp.mjs
      - name: Retain R65 local browser screenshots for independent PR QA
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r65-real-cover-takedown-browser-qa
          path: qa-r65/
          retention-days: 7
          if-no-files-found: warn
      - name: R64 actual keyboard World navigation, focus recovery and reduced-motion QA
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r64.keyboard_accessibility_cdp.mjs
          node server-lab/test/r64.keyboard_accessibility_cdp.mjs
      - name: R64 real Chromium desktop-mobile keyboard screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r64-accessible-keyboard-navigation
          path: qa-r64/
          retention-days: 7
          if-no-files-found: warn
      - name: R71 verify static bilingual labels and user-content translation isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r71.locale_dictionary.test.mjs
          node --test server-lab/test/r71.locale_dictionary.test.mjs
      - name: R77 verify dynamic RU-EN labels, safe live controls and unchanged user-generated content
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r77.dynamic_locale_keys.test.mjs
          node --test server-lab/test/r77.dynamic_locale_keys.test.mjs
      - name: R89 genuine SQLite readiness privilege, FK corruption and recovery HTTP QA
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r89.sqlite_readiness.test.mjs
          node --test server-lab/test/r89.sqlite_readiness.test.mjs
      - name: R89 real Chrome operator readiness RU EN 1440 390 360
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r89.readiness_browser_cdp.mjs
          node server-lab/test/r89.readiness_browser_cdp.mjs
      - name: Retain R89 operator SQLite readiness browser captures
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r89-operator-sqlite-readiness
          path: qa-r89/
          retention-days: 7
          if-no-files-found: warn
      - name: R85 reject hostile PNG variants, corrupted CRC and metadata with real SQLite
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r85.adversarial_png_security.test.mjs
          node --test server-lab/test/r85.adversarial_png_security.test.mjs
      - name: R81 independent content freeze, account deletion and incident recovery QA
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r81.content_freeze.test.mjs
          node --test server-lab/test/r81.content_freeze.test.mjs
      - name: R79 independent incident-switch and multi-route privacy test
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r79.media_incident_kill_switch.test.mjs
          node --test server-lab/test/r79.media_incident_kill_switch.test.mjs
      - name: R82 actual bilingual incident banner QA in Chrome 1440 390 360
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r82.incident_banner_cdp.mjs
          node server-lab/test/r82.incident_banner_cdp.mjs
      - name: Retain R82 incident RU EN screenshots for independent review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r82-real-incident-mobile-desktop
          path: qa-r82/
          retention-days: 7
          if-no-files-found: warn
      - name: R71 bilingual UI and user-content isolation in actual desktop/mobile Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --check server-lab/test/r71.bilingual_browser_cdp.mjs
          node server-lab/test/r71.bilingual_browser_cdp.mjs
      - name: Retain R71 six real RU-EN locale browser screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r71-verified-bilingual-shell
          path: qa-r71/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload R60 browser media QA screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r60-real-media-lifecycle-chromium
          path: qa-r60/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload real browser captures including pilot onboarding and social safety
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marcosa-r47-verifiable-cohort-and-beta-chrome-qa
          path: qa-r30/
          retention-days: 7
          if-no-files-found: error
      - name: Confirm public preview remains isolated
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'server-lab/' tools/build_webroot.py
          ! grep -q 'server-lab/' .github/workflows/marcosa-public-pages.yml
          ! grep -q 'StrictHostKeyChecking=no' .github/workflows/marcosa-staging.yml
